[project]
name = "ai-job-search-pipeline"
version = "1.4.0"
description = "A private, Paperclip-orchestrated job discovery, verification, matching, and approval-gated application pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Albert Deluna" }]
keywords = ["job-search", "recruiting", "webclaw", "paperclip", "agents", "resume-matching", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
jobspy = ["python-jobspy==1.1.82"]
browser-use = ["browser-use[core]==0.13.6; python_version >= '3.11'"]

[project.scripts]
ai-job-pipeline = "job_pipeline.cli:main"

[project.urls]
Source = "https://github.com/adeluna1/ai-job-search-pipeline"
WebClaw = "https://github.com/0xMassi/webclaw"
Paperclip = "https://github.com/paperclipai/paperclip"
JobSpy = "https://github.com/speedyapply/JobSpy"
ResumeMatcher = "https://github.com/srbhr/Resume-Matcher"
BrowserUse = "https://github.com/browser-use/browser-use"
AgentWebBrowser = "https://github.com/BarnsL/agent-web-browser"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_pipeline*"]
