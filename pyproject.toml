[project]
name = "ai-job-search-pipeline"
version = "1.0.0"
description = "A private, local-first job discovery and resume-matching pipeline powered by WebClaw."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Albert Deluna" }]
keywords = ["job-search", "recruiting", "webclaw", "resume-matching", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
ai-job-pipeline = "job_pipeline.cli:main"

[project.urls]
Source = "https://github.com/"
WebClaw = "https://github.com/0xMassi/webclaw"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_pipeline*"]
